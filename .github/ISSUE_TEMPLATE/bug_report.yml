name: Bug report
description: Report a reproducible problem in Goci Connect
title: "bug: "
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Goci Connect. Do not include credentials, tokens, authorization codes, or other secrets.

  - type: textarea
    id: description
    attributes:
      label: Problem
      description: Describe what happened and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest code sample or sequence of steps that reproduces the issue.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Goci Connect version
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true

  - type: input
    id: go-version
    attributes:
      label: Go version
      placeholder: go1.26.5
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the operating system, provider, and any relevant HTTP or deployment details.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed all secrets and personally identifiable information.
          required: true
        - label: This is not a security vulnerability.
          required: true
