version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - errorlint
    - misspell
    - revive
  exclusions:
    rules:
      - linters:
          - revive
        text: 'exported method .*\.(Format|GoString) should have comment'

formatters:
  enable:
    - gofmt
    - goimports
